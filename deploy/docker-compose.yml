services:
  deskrelay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: deskrelay:1.0.1
    container_name: deskrelay
    restart: unless-stopped
    env_file:
      - deskrelay.env
    environment:
      DESKRELAY_DB_PATH: /data/relay.db
      DESKRELAY_PORT: "8080"
    ports:
      # Bind to loopback only; TLS and public exposure are terminated by nginx or cloudflared.
      - "127.0.0.1:8080:8080"
    volumes:
      - deskrelay-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  deskrelay-data:
    driver: local
